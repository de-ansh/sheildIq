<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ShieldIQ Loading State Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2463eb",
                        "background-light": "#f6f6f8",
                        "background-dark": "#111621",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    keyframes: {
                        shimmer: {
                            '100%': { transform: 'translateX(100%)' }
                        }
                    },
                    animation: {
                        shimmer: 'shimmer 2s infinite'
                    }
                },
            },
        }
    </script>
<style>
        .skeleton-box {
            position: relative;
            overflow: hidden;
            background-color: rgba(255, 255, 255, 0.05);
        }
        .skeleton-box::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            transform: translateX(-100%);
            background-image: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0,
                rgba(255, 255, 255, 0.03) 20%,
                rgba(255, 255, 255, 0.06) 60%,
                rgba(255, 255, 255, 0)
            );
            animation: shimmer 2s infinite;
        }
    </style>
</head>
<body aria-busy="true" class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
<!-- Global Progress Bar -->
<div class="fixed top-0 left-0 w-full h-0.5 bg-primary/20 z-50">
<div class="h-full bg-primary w-1/3 shadow-[0_0_10px_#2463eb]"></div>
</div>
<div class="flex h-screen overflow-hidden">
<!-- Sidebar Navigation (Muted) -->
<aside class="w-64 border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-background-dark/50 flex flex-col opacity-60 pointer-events-none">
<div class="p-6 flex items-center gap-3">
<div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-white">
<span class="material-symbols-outlined text-xl">shield</span>
</div>
<h1 class="text-xl font-bold tracking-tight">ShieldIQ</h1>
</div>
<nav class="flex-1 px-4 space-y-1">
<div class="flex items-center gap-3 px-3 py-2 rounded-lg bg-primary/10 text-primary">
<span class="material-symbols-outlined">dashboard</span>
<span class="text-sm font-medium">Dashboard</span>
</div>
<div class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-500">
<span class="material-symbols-outlined">description</span>
<span class="text-sm font-medium">Reports</span>
</div>
<div class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-500">
<span class="material-symbols-outlined">bar_chart</span>
<span class="text-sm font-medium">Analytics</span>
</div>
<div class="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-500">
<span class="material-symbols-outlined">settings</span>
<span class="text-sm font-medium">Settings</span>
</div>
</nav>
<div class="p-4 border-t border-slate-200 dark:border-slate-800">
<div class="flex items-center gap-3 p-2 rounded-lg">
<div class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-800"></div>
<div class="flex-1">
<div class="h-3 w-20 bg-slate-200 dark:bg-slate-800 rounded mb-1"></div>
<div class="h-2 w-12 bg-slate-200 dark:bg-slate-800 rounded"></div>
</div>
</div>
</div>
</aside>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col min-w-0 overflow-hidden">

<header class="h-16 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-8 bg-white/50 dark:bg-background-dark/50 backdrop-blur-md opacity-70">
<div class="flex items-center gap-4 w-1/3">
<div class="relative w-full max-w-xs">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg">search</span>
<input class="w-full bg-slate-100 dark:bg-slate-800 border-none rounded-lg pl-10 text-sm py-2" disabled="" placeholder="Search intelligence..." type="text"/>
</div>
</div>
<div class="flex items-center gap-4">
<div class="w-8 h-8 flex items-center justify-center text-slate-400">
<span class="material-symbols-outlined">notifications</span>
</div>
<div class="w-8 h-8 flex items-center justify-center text-slate-400">
<span class="material-symbols-outlined">help</span>
</div>
</div>
</header>
<!-- Dashboard Content -->
<div class="flex-1 overflow-y-auto p-8 space-y-8">
<!-- Page Title Loading -->
<div class="flex items-end justify-between">
<div>
<div class="h-8 w-64 skeleton-box rounded-lg mb-2"></div>
<div class="h-4 w-96 skeleton-box rounded-md"></div>
</div>
<div class="h-10 w-32 skeleton-box rounded-lg"></div>

<div class="h-10 w-24 skeleton-box rounded-lg mb-4"></div>
<div class="h-4 w-20 skeleton-box rounded"></div>
</div>
<!-- Metric Card 3 -->
<div class="bg-white dark:bg-slate-900/40 border border-slate-200 dark:border-slate-800 p-6 rounded-xl shadow-sm">

<div class="h-10 w-36 skeleton-box rounded-lg mb-4"></div>
<div class="h-4 w-12 skeleton-box rounded"></div>

<div class="bg-white dark:bg-slate-900/40 border border-slate-200 dark:border-slate-800 p-6 rounded-xl shadow-sm">
<div class="h-4 w-24 skeleton-box rounded mb-4"></div>
<div class="h-10 w-28 skeleton-box rounded-lg mb-4"></div>
<div class="h-4 w-24 skeleton-box rounded"></div>
</div>
</div>
<!-- Middle Content Grid -->
<div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
<!-- Intelligence Trends (2/3 width) -->

<div class="flex justify-between items-center mb-8">
<div class="h-6 w-48 skeleton-box rounded"></div>
<div class="h-8 w-24 skeleton-box rounded"></div>
</div>
<div class="space-y-6">
<!-- Bar Row 1 -->
<div class="space-y-2">
<div class="flex justify-between">
<div class="h-3 w-32 skeleton-box rounded"></div>
<div class="h-3 w-8 skeleton-box rounded"></div>
</div>
<div class="h-3 w-full bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
<div class="h-full w-3/4 skeleton-box"></div>
</div>
</div>
<!-- Bar Row 2 -->

<div class="flex justify-between">
<div class="h-3 w-24 skeleton-box rounded"></div>

</div>

</div>

<!-- Bar Row 3 -->

</div>
<div class="h-3 w-full bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">

</div>

</div>
<div class="h-3 w-full bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
<div class="h-full w-1/3 skeleton-box"></div>
</div>
</div>
<!-- Bar Row 5 -->
<div class="space-y-2">
<div class="flex justify-between">
<div class="h-3 w-28 skeleton-box rounded"></div>
<div class="h-3 w-8 skeleton-box rounded"></div>
</div>
<div class="h-3 w-full bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
<div class="h-full w-3/5 skeleton-box"></div>
</div>
</div>
</div>
</div>
<!-- Distribution Chart (1/3 width) -->
<div class="bg-white dark:bg-slate-900/40 border border-slate-200 dark:border-slate-800 p-6 rounded-xl flex flex-col items-center">
<div class="w-full mb-8">
<div class="h-6 w-40 skeleton-box rounded"></div>
</div>
<!-- Donut Chart Skeleton -->
<div class="relative w-48 h-48 flex items-center justify-center mb-8">
<svg class="w-full h-full transform -rotate-90">
<circle class="text-slate-100 dark:text-slate-800" cx="96" cy="96" fill="transparent" r="80" stroke="currentColor" stroke-width="16"></circle>
<circle class="text-slate-200 dark:text-slate-700/50" cx="96" cy="96" fill="transparent" r="80" stroke="currentColor" stroke-dasharray="502" stroke-dashoffset="150" stroke-width="16"></circle>
</svg>
<div class="absolute inset-0 flex flex-col items-center justify-center">
<div class="h-6 w-16 skeleton-box rounded mb-1"></div>
<div class="h-3 w-12 skeleton-box rounded"></div>
</div>
</div>
<!-- Legend Items Skeleton -->
<div class="w-full space-y-4 px-4">
<div class="flex items-center gap-3">
<div class="w-3 h-3 rounded-full skeleton-box"></div>
<div class="h-3 flex-1 skeleton-box rounded"></div>
<div class="h-3 w-8 skeleton-box rounded"></div>
</div>
<div class="flex items-center gap-3">
<div class="w-3 h-3 rounded-full skeleton-box"></div>
<div class="h-3 flex-1 skeleton-box rounded"></div>
<div class="h-3 w-8 skeleton-box rounded"></div>
</div>
<div class="flex items-center gap-3">
<div class="w-3 h-3 rounded-full skeleton-box"></div>
<div class="h-3 flex-1 skeleton-box rounded"></div>
<div class="h-3 w-8 skeleton-box rounded"></div>
</div>
</div>
</div>
</div>
<!-- Recent Activity Table Skeleton -->
<div class="bg-white dark:bg-slate-900/40 border border-slate-200 dark:border-slate-800 rounded-xl overflow-hidden">
<div class="p-6 border-b border-slate-200 dark:border-slate-800">
<div class="h-6 w-48 skeleton-box rounded"></div>
</div>
<div class="p-6">
<div class="space-y-6">
<!-- Table Header -->
<div class="grid grid-cols-4 gap-4 pb-4 border-b border-slate-100 dark:border-slate-800">
<div class="h-3 w-24 skeleton-box rounded"></div>

<div class="h-4 w-40 skeleton-box rounded"></div>
<div class="h-4 w-20 skeleton-box rounded"></div>
<div class="h-8 w-24 skeleton-box rounded ml-auto"></div>
</div>
</div>
</div>
</div>
</div>
</main>
</div>
</body></html>
